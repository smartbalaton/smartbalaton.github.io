<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balaton felújítás</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Balaton felújítás</h1>

    <div class="tabs-container">
        <button class="tab-button active" data-tab="felujitas">Felújítás</button>
        <button class="tab-button" data-tab="latvany">Látványtervek</button>
    </div>

    <div id="felujitas" class="tab-content active">
        <div id="gallery-container-felujitas" class="gallery-container"></div>
    </div>

    <div id="latvany" class="tab-content">
        <div id="gallery-container-latvany" class="gallery-container"></div>
    </div>

    <!-- The Modal -->
    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        <span class="prev">&#10094;</span>
        <span class="next">&#10095;</span>
        <div class="modal-content">
            <img id="modal-image">
        </div>
    </div>

    <script src="script1.js"></script>
</body>
</html>
